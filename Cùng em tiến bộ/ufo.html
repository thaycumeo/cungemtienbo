<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UFO bắt học sinh</title></head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500..800&family=Nunito:wght@400..800&display=swap">
<style>
/* Hướng thiết kế: sân trường nắng, chibi quàng khăn đỏ, UFO tím có mặt Bé Sao. Toàn bộ cảnh vẽ trong khung 1600x900 rồi co giãn theo màn hình. */
:root{
  --night:#17123F; --ink:#2F2663; --violet:#6A4CF0; --violet-d:#3A2FB0; --sun:#FFCF3D; --pink:#FF7EB3; --mint:#7FDCC8; --paper:#FFFFFF; --sky-line:#9BD0FF;
  --f-h:'Baloo 2','Arial Rounded MT Bold',Arial,sans-serif; --f-b:'Nunito',Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:#fff;font-family:var(--f-b);overflow:hidden}
#app{height:100%;container-type:size;display:grid;place-items:center;background:var(--night)}
#frame{position:relative;width:min(100cqw,calc(100cqh*16/9));aspect-ratio:16/9;container-type:size}
#stage{position:absolute;inset:0;container-type:size;overflow:hidden;overflow:clip;background:#8CCBFF;user-select:none;-webkit-user-select:none}
#scaler{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
#cam{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;transition:transform 1.7s cubic-bezier(.55,0,.2,1)}
#cam.snap{transition-duration:.9s}
#bg{position:absolute;left:0;top:0;width:1600px;height:900px}
.cloud{animation:drift 90s linear infinite alternate}
.cloud.c2{animation-duration:130s}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(60px)}}

/* học sinh */
#field{position:absolute;inset:0}
.stu{position:absolute;width:100px;height:170px;transform-origin:50% 100%;will-change:transform}
.stu .in{position:absolute;inset:0;transform:scale(var(--s,1));transform-origin:50% 100%}
.stu .fig{position:absolute;left:10px;bottom:0;width:80px;height:120px;overflow:visible;animation:breathe 2.6s ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
.pill{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:1px 12px 2px 9px;border-radius:999px;background:#fff;border:3px solid #C9C3F5;font:800 24px/1.15 var(--f-h);color:#2B2780;white-space:nowrap;box-shadow:0 3px 0 rgba(47,38,99,.18);transition:transform .15s,background .15s}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--violet);flex:none}
.stu.scan .pill{background:var(--sun);border-color:#fff;transform:translateX(-50%) scale(1.3);color:var(--ink)}
.stu.scan .fig{filter:drop-shadow(0 0 12px #8ff)}
.stu.locked .pill{background:#FF5C7A;border-color:#fff;color:#fff;transform:translateX(-50%) scale(1.45);animation:lockp .5s ease-in-out infinite alternate}
.stu.locked .pill i{background:#fff}
@keyframes lockp{to{transform:translateX(-50%) scale(1.58)}}
.stu.lifting{z-index:2600!important}
.stu.lifting .fig{animation:none;filter:drop-shadow(0 0 14px #7ff) brightness(1.15)}
.stu.gone{display:none}
.lock{position:absolute;left:50%;bottom:-6px;width:150px;height:42px;margin-left:-75px;border-radius:50%;border:5px solid #FF5C7A;box-shadow:0 0 18px #FF5C7A,inset 0 0 14px rgba(255,92,122,.5);animation:lockr .7s ease-in-out infinite alternate;pointer-events:none}
@keyframes lockr{from{transform:scale(.8);opacity:.7}to{transform:scale(1.15);opacity:1}}

/* UFO và tia laser */
#ufo{position:absolute;left:0;top:0;width:340px;height:193px;will-change:transform;z-index:2000}
#ufoTilt{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .12s linear}
#ufoIn{position:absolute;inset:0;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-7px)}50%{transform:translateY(8px)}}
#ufoIn svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 14px rgba(30,20,90,.35))}
.l1,.l2{animation:blink .9s steps(2,jump-none) infinite}
.l2{animation-delay:.45s}
@keyframes blink{0%{opacity:1}100%{opacity:.35}}
#ufo.charge #ufoIn{animation:shake .09s linear infinite}
@keyframes shake{0%{transform:translate(-3px,1px)}50%{transform:translate(3px,-2px)}100%{transform:translate(-2px,-1px)}}
#ufo.squash #ufoIn{animation:squash .5s ease-out 1}
@keyframes squash{0%{transform:scale(1,1)}30%{transform:scale(1.18,.82)}60%{transform:scale(.94,1.08)}100%{transform:scale(1,1)}}
#beamWrap{position:absolute;left:50%;top:150px;width:260px;margin-left:-130px;height:0;transform-origin:50% 0;opacity:0;transition:opacity .35s,transform .35s;filter:drop-shadow(0 0 16px rgba(110,255,210,.9));pointer-events:none}
#beamWrap.soft{opacity:.32;transform:scaleX(.5)}
#beamWrap.on{opacity:1;transform:scaleX(1)}
#beam{position:absolute;inset:0;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);
  background:
   repeating-linear-gradient(180deg,rgba(255,255,255,0) 0 22px,rgba(255,255,255,.5) 22px 30px),
   linear-gradient(180deg,rgba(255,255,170,.95),rgba(120,255,214,.72) 45%,rgba(80,200,255,.38));
  background-size:100% 60px,100% 100%;animation:stripes .5s linear infinite}
#beamWrap.on #beam{animation-duration:.22s}
@keyframes stripes{from{background-position:0 60px,0 0}to{background-position:0 0,0 0}}
#spark{position:absolute;inset:0;overflow:hidden;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
#spark b{position:absolute;bottom:0;width:10px;height:10px;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 10px #fff;animation:rise 1.1s linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(var(--h,-400px)) scale(1.1);opacity:0}}

/* nền mờ khi quay chậm */
#vignette{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s;background:radial-gradient(ellipse at center,rgba(20,10,70,0) 45%,rgba(20,10,70,.55) 100%);z-index:30}
#vignette.on{opacity:1}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
#flash.go{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}

/* giao diện bên trên cảnh (cỡ chữ theo chiều rộng khung) */
.hud{position:absolute;z-index:40;font-size:clamp(11px,1.45cqw,26px);transition:opacity .5s}
#frame.cine .hud:not(#bar){opacity:0;pointer-events:none}
#title{left:1.6cqw;top:2cqh;display:flex;align-items:center;gap:1em;padding:.5em 1.6em .5em .6em;border-radius:999px;background:linear-gradient(180deg,#5C4DE6,var(--violet-d));border:.22em solid var(--sky-line);box-shadow:0 .3em 0 rgba(47,38,99,.35)}
#title svg{width:3em;height:3em;flex:none;background:#2A2390;border-radius:50%;padding:.3em;box-sizing:border-box}
#title b{display:block;font:800 1.55em/1 var(--f-h);letter-spacing:.02em}
#title b em{font-style:normal;color:var(--sun)}
#title small{display:block;font:800 .8em/1.2 var(--f-h);letter-spacing:.18em;color:#D8D2FF;margin-top:.15em}
#counter{right:1.6cqw;top:2cqh;display:flex;align-items:center;gap:.9em;padding:.55em 1.3em;border-radius:999px;background:#fff;color:var(--ink);font:800 1.25em/1 var(--f-h);box-shadow:0 .25em 0 rgba(47,38,99,.2)}
#counter span{opacity:.5}
#counter b{color:var(--violet)}
#hint{left:50%;top:3cqh;transform:translateX(-50%);padding:.55em 1.3em;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);font:800 1.15em/1.2 var(--f-h);white-space:nowrap;box-shadow:0 .25em 0 rgba(47,38,99,.2);transition:opacity .4s}
#hint.off{opacity:0;pointer-events:none}
#bar{left:0;right:0;bottom:1.8cqh;display:flex;align-items:center;justify-content:center;gap:1.1em;padding:0 1.6cqw;z-index:70;pointer-events:none}
#bar .btn{pointer-events:auto}
#tools{right:1.6cqw;top:11cqh;display:flex;flex-direction:column;align-items:flex-end;gap:.6em;z-index:70}
.btn{font:800 1.2em/1 var(--f-h);color:var(--ink);background:#fff;border:.2em solid var(--ink);border-radius:999px;padding:.7em 1.3em;cursor:pointer;display:inline-flex;align-items:center;gap:.55em;box-shadow:0 .28em 0 var(--ink);transition:transform .08s,box-shadow .08s,background .15s}
.btn:hover{background:#F3F0FF}
.btn:active{transform:translateY(.2em);box-shadow:0 .08em 0 var(--ink)}
.btn:focus-visible{outline:.25em solid var(--sun);outline-offset:.2em}
.btn svg{width:1.25em;height:1.25em;flex:none}
.btn.main{font-size:1.6em;padding:.45em 1.5em;color:#fff;background:linear-gradient(180deg,#8A6DFF,var(--violet-d));border-color:#fff;box-shadow:0 .2em 0 var(--ink),0 0 0 .2em var(--ink)}
.btn.main:hover{background:linear-gradient(180deg,#9C82FF,#4A3FD0)}
.btn.main[disabled]{background:#8D88B8;cursor:default;transform:none}
.btn.pulse{animation:btnp .8s ease-in-out infinite alternate;background:var(--sun)}
@keyframes btnp{to{transform:scale(1.07)}}
.btn.sm{font-size:.95em;padding:.5em .9em}

/* màn hình công bố */
#reveal{position:absolute;inset:0;z-index:50;overflow:hidden;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .45s;background:radial-gradient(circle at center,rgba(20,10,80,.55),rgba(20,10,80,.8))}
#reveal.show{opacity:1}
#rays{position:absolute;left:50%;top:46%;width:150cqw;height:150cqw;margin:-75cqw 0 0 -75cqw;background:repeating-conic-gradient(from 0deg,rgba(255,207,61,.34) 0 7deg,rgba(255,207,61,0) 7deg 20deg);border-radius:50%;animation:spin 14s linear infinite;-webkit-mask:radial-gradient(circle,#000 8%,transparent 62%);mask:radial-gradient(circle,#000 8%,transparent 62%)}
@keyframes spin{to{transform:rotate(360deg)}}
#rcard{position:relative;text-align:center;transform:scale(.2) rotate(-12deg);transition:transform .7s cubic-bezier(.2,1.5,.4,1) .1s;margin-top:-6cqh}
#reveal.show #rcard{transform:scale(1) rotate(0)}
#ab{font:800 9.5cqw/1 var(--f-h);letter-spacing:.04em;color:var(--sun);-webkit-text-stroke:.5cqw var(--ink);paint-order:stroke fill;text-shadow:0 .9cqw 0 var(--ink),0 0 5cqw rgba(255,207,61,.8)}
#who{display:flex;align-items:flex-end;justify-content:center;gap:2.5cqw;margin-top:1.2cqh}
#who svg{width:15cqw;height:22.5cqw;overflow:visible;animation:dangle 1.4s ease-in-out infinite;transform-origin:50% 0}
@keyframes dangle{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-1cqw)}}
#nm{font:800 6.4cqw/1.1 var(--f-h);color:#fff;background:linear-gradient(180deg,#8A6DFF,var(--violet-d));border:.5cqw solid #fff;border-radius:3cqw;padding:.8cqw 3cqw 1.2cqw;box-shadow:0 1cqw 0 var(--ink);max-width:64cqw;overflow-wrap:anywhere}
#sub{margin-top:2cqh;font:800 2.4cqw/1.2 var(--f-h);color:#fff;text-shadow:0 .2cqw .6cqw rgba(0,0,0,.5)}
#confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#confetti i{position:absolute;top:-6%;width:1.1cqw;height:1.6cqw;opacity:.95;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),115cqh) rotate(var(--r))}}

#stars{display:flex;gap:1cqw;justify-content:center;flex-wrap:wrap;margin-top:2.2cqh;pointer-events:auto}
#stars .btn{font-size:clamp(11px,1.7cqw,30px)}
#stars .btn.g{background:#7FDCC8}#stars .btn.k{background:var(--sun)}

/* hộp thoại danh sách */
#dlg{position:absolute;inset:0;z-index:200;display:none;place-items:center;background:rgba(20,10,70,.7)}
#dlg.open{display:grid}
#dlg .box{width:min(92%,640px);max-height:92%;overflow:auto;background:#fff;color:var(--ink);border-radius:22px;padding:22px 24px;border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink);font-size:15px;display:flex;flex-direction:column;gap:12px}
#dlg h2{margin:0;font:800 26px/1.1 var(--f-h)}
#dlg p{margin:0;font-weight:600;line-height:1.45;color:#4A4180}
#dlg textarea{width:100%;box-sizing:border-box;min-height:200px;max-height:40vh;resize:vertical;border:3px solid #C9C3F5;border-radius:14px;padding:12px;font:600 16px/1.5 var(--f-b);color:var(--ink);background:#FAF8FF}
#dlg textarea:focus{outline:3px solid var(--sun);border-color:var(--violet)}
#dlg .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#dlg .row .sp{flex:1}
#dlg .cnt{font:800 15px var(--f-h);color:var(--violet)}
#dlg .btn{font-size:16px}

@media (max-width:1000px){#hint{display:none}}
@media (max-width:700px){
  #app{display:flex;flex-direction:column;justify-content:center;align-items:center}
  #frame{width:100cqw;aspect-ratio:auto;height:auto;container-type:normal;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;padding:0 12px 14px;box-sizing:border-box}
  #stage{position:relative;inset:auto;flex:0 0 calc(100% + 24px);margin:0 -12px;aspect-ratio:16/9}
  .hud{position:static;font-size:14px}
  #bar{flex:0 0 100%;padding:0}
  #tools{flex:0 0 100%;flex-direction:row;justify-content:center;flex-wrap:wrap}
  #title,#counter{box-shadow:none}
  #title{flex:0 1 auto}
  .btn.main{font-size:1.45em}
  #frame.cine .hud:not(#bar){opacity:1;pointer-events:auto}
}
@media (prefers-reduced-motion:reduce){
  .cloud,.stu .fig,#ufoIn,.l1,.l2,#rays{animation:none}
}
</style>

  $('#nm').textContent = it.name;
  lastTarget = it; const f = $('#whoFig'); f.style.cssText = it.el.style.cssText.replace(/(left|top|z-index|--s|--d):[^;]+;?/g, '');
  $('#sub').textContent = remain().length ? 'UFO vừa mời một bạn lên tàu!' : 'Đây là bạn cuối cùng. Cả lớp đã được gọi tên!';
  const st = $('#stars'); st.hidden = !EMBED; st.querySelectorAll('button').forEach(b => b.disabled = false);
  confetti(); $('#reveal').classList.add('show');
}
function hideReveal() { $('#reveal').classList.remove('show'); }

/* ---------- vòng chơi ---------- */
const ease = {
  io: t => .5 - Math.cos(Math.PI * t) / 2,
  out: t => 1 - Math.pow(1 - t, 3)
};
function scanTo(target, id) {
  return new Promise(res => {
    const far = prev => { let x, n = 0; do { x = rnd(170, W - 170); n++; } while ((Math.abs(x - prev) < 420 || Math.abs(x - target.x) < 260) && n < 30); return x; };
    const s1 = far(ufoX), s2 = far(s1), s3 = far(s2);
    const segs = [[s1, 1000, ease.io], [s2, 950, ease.io], [s3, 900, ease.io], [target.x, 1800, ease.out]];
    let si = 0, from = ufoX, t0 = performance.now(), lastX = ufoX, hot = new Set();
    function frame(now) {
      if (id !== runId) return res(false);
      const [to, dur, fn] = segs[si], p = clamp((now - t0) / dur, 0, 1), x = from + (to - from) * fn(p);
      lastTilt += (clamp((x - lastX) * 1.6, -14, 14) - lastTilt) * .25; lastX = x;
      setUfo(x, lastTilt); Snd.humSet(x);
      const now2 = new Set();
      for (const it of items) { if (it.gone) continue; const on = Math.abs(it.x - x) < 52; it.el.classList.toggle('scan', on); if (on) now2.add(it); }
      for (const it of now2) if (!hot.has(it)) { Snd.blip(); break; }
      hot = now2;
      if (p >= 1) { si++; if (si >= segs.length) { setUfo(target.x, 0); lastTilt = 0; for (const it of items) it.el.classList.remove('scan'); return res(true); } from = x; t0 = now; }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

async function round() {
  if (state === 'running' || !remain().length) return;
  const id = ++runId; state = 'running'; syncUI();
  Snd.init(); hideReveal();
  const was = zoomed; zoomed = false; camReset(); $('#vignette').classList.remove('on'); frame.classList.remove('cine');
  if (was) { await sleep(1000); if (id !== runId) return; }
  const pool = remain(), target = pool[Math.floor(Math.random() * pool.length)];
  const feet = target.y, h = GROUND + 40 - EMIT;
  makeSparks(h); setBeam(h, 'soft'); Snd.humStart();

  const ok = await scanTo(target, id); if (!ok || id !== runId) return;
  Snd.humStop();

  // khoá mục tiêu và quay chậm
  target.el.classList.add('locked');
  const lk = document.createElement('div'); lk.className = 'lock'; target.el.appendChild(lk);
  Snd.lock(); ufo.classList.add('charge');
  zoomed = true; const zs = clamp(H / (feet - UFO_Y + 60), 1.2, 2.0); camTo(target.x, (UFO_Y + feet) / 2 + 10, zs);
  $('#vignette').classList.add('on'); frame.classList.add('cine');
  await sleep(1300); if (id !== runId) return;

  // tia laser hút học sinh
  const bh = feet + 8 - EMIT; makeSparks(bh); setBeam(bh, 'on'); Snd.beamOn();
  await sleep(900); if (id !== runId) return;
  ufo.classList.remove('charge'); lk.remove();
  target.el.classList.remove('locked'); target.el.classList.add('lifting'); Snd.lift();
  const dist = feet - EMIT - 30;
  let anim;
  try {
    anim = target.el.animate([
      { transform: 'translateY(0) rotate(0deg) scale(1)', opacity: 1, offset: 0 },
      { transform: 'translateY(-16px) rotate(-6deg) scale(1)', opacity: 1, offset: .12 },
      { transform: `translateY(${-dist * .22}px) rotate(7deg) scale(.95)`, opacity: 1, offset: .35 },
      { transform: `translateY(${-dist * .6}px) rotate(-10deg) scale(.7)`, opacity: 1, offset: .68 },
      { transform: `translateY(${-dist}px) rotate(16deg) scale(.22)`, opacity: 1, offset: .96 },
      { transform: `translateY(${-dist - 20}px) rotate(20deg) scale(.1)`, opacity: 0, offset: 1 }
    ], { duration: 3300, easing: 'cubic-bezier(.45,.05,.3,1)', fill: 'forwards' });
    await anim.finished;
  } catch (e) { return; }
  if (id !== runId) return;

  // bị bắt
  target.gone = true; post({ type: 'abducted', id: target.id }); target.el.classList.add('gone'); target.el.classList.remove('lifting');
  anim.cancel(); setBeam(bh, ''); Snd.pop();
  ufo.classList.add('squash'); $('#flash').classList.remove('go'); void $('#flash').offsetWidth; $('#flash').classList.add('go');
  await sleep(450); if (id !== runId) return;
  ufo.classList.remove('squash'); $('#vignette').classList.remove('on'); frame.classList.remove('cine');
  state = remain().length ? 'reveal' : 'done'; syncUI();
  showReveal(target); Snd.fanfare();
}

function reset(user) {
  if (user === true) post({ type: 'reset' });
  runId++; Snd.humStop(); state = 'idle'; zoomed = false;
  items.forEach(it => { it.gone = false; it.el.getAnimations().forEach(a => a.cancel()); it.el.className = 'stu'; const l = it.el.querySelector('.lock'); if (l) l.remove(); });
  ufo.classList.remove('charge', 'squash'); setBeam(0, ''); hideReveal(); $('#vignette').classList.remove('on'); frame.classList.remove('cine');
  camReset(); setUfo(W / 2, 0); lastTilt = 0; $('#stars').hidden = true; syncUI();
}

/* ---------- danh sách ---------- */
const dlg = $('#dlg'), ta = $('#names');
function updCnt() { const n = parseNames(ta.value).length; $('#dlgCnt').textContent = n + ' học sinh' + (n >= 80 ? ' (tối đa 80)' : ''); }
function openDlg() { ta.value = roster.map(r => r.name).join('\n'); updCnt(); dlg.classList.add('open'); ta.focus(); }
function closeDlg() { dlg.classList.remove('open'); bMain.focus(); }
function apply() { roster = toRoster(parseNames(ta.value)); saveNames(); reset(); build(); syncUI(); closeDlg(); }

/* ---------- sự kiện ---------- */
bMain.addEventListener('click', round);
bReset.addEventListener('click', () => reset(true));
$('#bList').addEventListener('click', openDlg);
$('#dClose').addEventListener('click', closeDlg);
$('#dApply').addEventListener('click', apply);
$('#dSample').addEventListener('click', () => { ta.value = SAMPLE.join('\n'); updCnt(); });
$('#dClear').addEventListener('click', () => { ta.value = ''; updCnt(); ta.focus(); });
ta.addEventListener('input', updCnt);
$('#bSnd').addEventListener('click', e => {
  Snd.on = !Snd.on; if (!Snd.on) Snd.humStop(); else Snd.init();
  e.currentTarget.setAttribute('aria-pressed', String(Snd.on)); $('#sndT').textContent = Snd.on ? 'Âm thanh' : 'Đã tắt tiếng'; $('#sndW').style.display = Snd.on ? '' : 'none';
});
const app = $('#app');
$('#bFs').addEventListener('click', async () => {
  try { if (document.fullscreenElement) await document.exitFullscreen(); else await app.requestFullscreen(); } catch (e) { $('#fsT').textContent = 'Không hỗ trợ'; setTimeout(() => $('#fsT').textContent = 'Toàn màn hình', 1800); }
});
document.addEventListener('fullscreenchange', () => { $('#fsT').textContent = document.fullscreenElement ? 'Thoát toàn màn hình' : 'Toàn màn hình'; });
document.addEventListener('keydown', e => {
  if (dlg.classList.contains('open')) { if (e.key === 'Escape') closeDlg(); return; }
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === ' ' || e.key === 'Enter') { if (e.target.tagName === 'BUTTON') return; e.preventDefault(); if (!bMain.disabled) round(); }
  else if (e.key === 'r' || e.key === 'R') reset(true);
  else if (e.key === 'f' || e.key === 'F') $('#bFs').click();
});
$('#stars').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !lastTarget) return;
  const d = +b.dataset.d; post({ type: 'star', id: lastTarget.id, d });
  $('#stars').hidden = true;
  $('#sub').textContent = d > 0 ? 'Đã cộng ' + d + ' sao cho ' + given(lastTarget.name) + '!' : 'Không sao, lần sau mình làm được nhé!';
  if (d > 0) { confetti(); Snd.fanfare(); }
});
window.addEventListener('message', e => {
  const m = e.data; if (!m || m.src !== 'app' || m.type !== 'init') return;
  Snd.on = m.sound !== false; roster = (m.students || []).map(x => ({ id: x.id, name: x.name, gone: !!x.gone }));
  reset(); build(); state = remain().length ? 'idle' : 'done'; syncUI();
});
new ResizeObserver(fit).observe(stage);

if (EMBED) { $('#bList').hidden = true; fit(); setUfo(W / 2, 0); syncUI(); post({ type: 'ready' }); }
else { roster = toRoster(loadNames()); fit(); build(); setUfo(W / 2, 0); syncUI(); }
})();
</script>

</body></html>
